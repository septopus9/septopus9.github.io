<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efficiency Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f9;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      background: #007BFF;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Efficiency Calculator</h1>
  <div class="container">
    <label for="smv">SMV (Standard Minute Value):</label>
    <input type="number" id="smv" placeholder="Enter SMV (e.g., 0.8)" step="0.01" required>

    <label for="output">Output (Number of Garments):</label>
    <input type="number" id="output" placeholder="Enter Output (e.g., 150)" required>

    <label for="operators">Number of Operators:</label>
    <input type="number" id="operators" placeholder="Enter Number of Operators (e.g., 30)" required>

    <button onclick="calculateEfficiency()">Calculate Efficiency</button>

    <div class="result" id="result">Efficiency: --</div>
  </div>

  <script>
    function calculateEfficiency() {
      const smv = parseFloat(document.getElementById("smv").value);
      const output = parseInt(document.getElementById("output").value, 10);
      const operators = parseInt(document.getElementById("operators").value, 10);
      const availableTime = 465; // Fixed in minutes

      if (!smv || !output || !operators) {
        document.getElementById("result").innerText = "Please fill in all fields correctly.";
        return;
      }

      const efficiency = (output * smv) / (availableTime * operators) * 100;
      document.getElementById("result").innerText = ⁠ Efficiency: ${efficiency.toFixed(2)}% ⁠;
    }
  </script>
</body>
</html>
